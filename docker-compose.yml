services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: kb-qdrant
    ports:
      - "127.0.0.1:6333:6333"   # REST + Web UI, loopback only — no LAN exposure
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      # qdrant image has no curl/wget — bash TCP probe instead
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  kb-api:
    build: .
    container_name: kb-api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  webui:
    build:
      context: .
      dockerfile: Dockerfile.webui
    container_name: kb-webui
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - KB_API_URL=http://kb-api:8000
      - LM_STUDIO_URL=http://host.docker.internal:1234/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - kb-api
    restart: unless-stopped
